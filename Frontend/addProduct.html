<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="addProduct.css">
    <title>Document</title>
</head>
<body>
    <div id="navbar"></div>

    <form id="form-add">
        <label for="name">Name:</label>
        <input type="text" id="name"  name="name" required placeholder="Name product">

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required placeholder="Price product">

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" placeholder="Description product">

        <label for="stock">Stock:</label>
        <input type="number" id="stock" name="stock" required placeholder="Stock available">

        <input type="file" id="image" name="image" accept="image/*">

        <select name="categories" id="categories" required></select>

        <button id="submit" type="button">Subir Producto</button>
    </form>

    <script src="config.js"></script>
    <script src="navbar.js"></script>
    <script src="addProduct.js"></script>
</body>
</html>
